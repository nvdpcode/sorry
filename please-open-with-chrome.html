<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>For You 💗</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Pacifico&display=swap');
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;overflow:hidden;
 display:flex;align-items:center;justify-content:center;
 font-family:"DM Sans",sans-serif;
 background:#0e1224;
 color:#fff;
}
canvas{position:fixed;inset:0;pointer-events:none}
.scene{
 width:min(94vw,650px);height:min(94vh,760px);position:relative;
 display:flex;align-items:center;justify-content:center;
}
.card{
 width:min(92vw,560px);height:700px;position:relative;overflow:hidden;
 border:1px solid rgba(255,255,255,.2);
 border-radius:38px;
 background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
 box-shadow:0 35px 100px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18);
 backdrop-filter:blur(18px);
 text-align:center;padding:34px 25px;
}
.glow{position:absolute;width:300px;height:300px;border-radius:50%;filter:blur(70px);opacity:.35}
.g1{background:#ff5e9b;top:-130px;left:-100px}.g2{background:#8b6cff;right:-130px;bottom:-100px}
.top{position:relative;z-index:5}
.kicker{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#ffc5db;font-weight:700}
h1{font-family:Pacifico,cursive;font-size:47px;font-weight:400;margin:10px 0 4px;
 background:linear-gradient(90deg,#fff,#ffb7d2,#fff);background-size:200%;
 -webkit-background-clip:text;color:transparent;animation:shine 4s linear infinite}
.sub{color:#d8d5e5;font-size:15px}
.stage{height:390px;position:relative;margin-top:5px}
.cat{
 position:absolute;left:50%;top:44px;transform:translateX(-50%);
 width:260px;height:300px;animation:bob 3s ease-in-out infinite;
}
.ear{position:absolute;top:12px;width:78px;height:91px;background:#ffc3d6;border:5px solid #382a42;z-index:1}
.el{left:29px;transform:rotate(-25deg);border-radius:75% 20% 20% 15%}
.er{right:29px;transform:rotate(25deg);border-radius:20% 75% 15% 20%}
.face{
 position:absolute;z-index:2;left:13px;top:42px;width:234px;height:196px;
 background:linear-gradient(145deg,#fff6eb,#ffdcca);border:5px solid #382a42;
 border-radius:48% 48% 46% 46%;
 box-shadow:inset 0 -8px 0 rgba(255,160,180,.12);
}
.eye{position:absolute;top:68px;width:22px;height:30px;background:#2b2032;border-radius:50%}
.eye:after{content:"";position:absolute;width:7px;height:8px;border-radius:50%;background:white;top:5px;left:5px}
.eleft{left:59px}.eright{right:59px}
.cheek{position:absolute;top:104px;width:34px;height:15px;background:#ff9db9;filter:blur(5px);opacity:.7;border-radius:50%}
.cl{left:25px}.cr{right:25px}
.nose{position:absolute;top:103px;left:104px;width:24px;height:17px;background:#f080a2;border-radius:50%}
.mouth{position:absolute;top:116px;left:97px;width:40px;height:25px;border-bottom:4px solid #493240;border-radius:0 0 50% 50%}
.wh{position:absolute;height:2px;width:72px;background:#b18b98;top:116px}
.wl1{left:-50px;transform:rotate(7deg)}.wl2{left:-50px;top:135px;transform:rotate(-7deg)}
.wr1{right:-50px;transform:rotate(-7deg)}.wr2{right:-50px;top:135px;transform:rotate(7deg)}
.body{position:absolute;left:67px;bottom:0;width:126px;height:93px;background:#ffe9d7;border:5px solid #382a42;border-radius:60% 60% 30% 30%}
.paw{position:absolute;z-index:5;bottom:25px;width:50px;height:68px;background:#ffe9d7;border:5px solid #382a42;border-radius:50%}
.pl{left:48px;transform:rotate(20deg)}.pr{right:38px;transform:rotate(-35deg)}
.flower{position:absolute;z-index:7;right:-3px;bottom:67px;transform:rotate(-8deg);animation:wave 2.5s ease-in-out infinite}
.stem{height:145px;width:8px;background:#5dbb75;border-radius:8px;margin-left:30px;transform:rotate(-5deg)}
.leaf{position:absolute;width:49px;height:22px;background:#70ca83;border-radius:100% 0 100% 0}
.l1{left:-1px;top:83px;transform:rotate(25deg)}.l2{left:23px;top:103px;transform:rotate(-25deg) scaleX(-1)}
.bloom{position:absolute;top:-51px;left:-1px;width:68px;height:68px}
.petal{position:absolute;width:37px;height:37px;border-radius:50%;background:#ff79aa;box-shadow:0 4px 12px #ff4e91}
.p1{left:15px;top:0}.p2{left:31px;top:16px}.p3{left:15px;top:32px}.p4{left:0;top:16px}
.center{position:absolute;left:22px;top:22px;width:25px;height:25px;background:#ffd95e;border-radius:50%;z-index:2}
.note{
 position:absolute;left:50%;bottom:2px;transform:translateX(-50%) rotate(-2deg);
 width:340px;padding:20px 25px 18px;background:#fff9ec;color:#513e4a;
 border-radius:5px 5px 18px 5px;box-shadow:0 12px 25px rgba(0,0,0,.22);
 font-family:Georgia,serif;font-size:18px;line-height:1.5;
}
.note:before{content:"";position:absolute;top:-12px;right:20px;width:70px;height:22px;background:rgba(255,180,205,.7);transform:rotate(4deg)}
.signature{font-family:Pacifico,cursive;color:#d95586;font-size:21px;margin-top:5px}
button{
 position:relative;z-index:8;border:0;padding:14px 25px;border-radius:99px;
 background:linear-gradient(90deg,#ff669c,#b982ff);color:#fff;font-weight:700;
 font-size:15px;box-shadow:0 10px 30px rgba(220,90,160,.3);cursor:pointer;
 transition:.25s
}
button:hover{transform:translateY(-2px) scale(1.03)}
.hidden{opacity:0;transform:translateY(10px);pointer-events:none;position:absolute}
.reveal{animation:reveal .8s forwards}
.heart{position:fixed;pointer-events:none;font-size:20px;animation:rise 2.7s ease-out forwards}
@keyframes bob{50%{transform:translateX(-50%) translateY(-9px)}}
@keyframes wave{50%{transform:rotate(4deg)}}
@keyframes shine{to{background-position:200%}}
@keyframes reveal{to{opacity:1;transform:translateY(0);position:relative}}
@keyframes rise{to{transform:translateY(-230px) scale(.3) rotate(30deg);opacity:0}}
@media(max-height:720px){.card{height:94vh}.stage{height:350px}.cat{top:20px}.note{bottom:-3px}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="scene">
<div class="card">
 <div class="glow g1"></div><div class="glow g2"></div>
 <div class="top">
  <div class="kicker">A tiny apology</div>
  <h1>I'm Sorry🥺</h1>
 </div>

 <div class="stage">
  <div class="cat">
   <div class="ear el"></div><div class="ear er"></div>
   <div class="face">
    <div class="eye eleft"></div><div class="eye eright"></div>
    <div class="cheek cl"></div><div class="cheek cr"></div>
    <div class="nose"></div><div class="mouth"></div>
    <div class="wh wl1"></div><div class="wh wl2"></div><div class="wh wr1"></div><div class="wh wr2"></div>
   </div>
   <div class="body"></div><div class="paw pl"></div><div class="paw pr"></div>
   <div class="flower">
    <div class="bloom"><div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div><div class="petal p4"></div><div class="center"></div></div>
    <div class="stem"></div><div class="leaf l1"></div><div class="leaf l2"></div>
   </div>
  </div>
  <div class="note">
   <div class="signature">Can you forgive me? 🌷</div>
  </div>
 </div>

 <button id="forgive">Tap for a little surprise ✨</button>
 <div id="extra" class="hidden">
   <div style="font-family:Pacifico;font-size:28px;margin-top:5px">🌼</div>
 </div>
</div>
</div>
<script>
const c=document.getElementById('stars'),x=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight} resize(); addEventListener('resize',resize);
let stars=Array.from({length:90},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.8+.3,a:Math.random(),s:Math.random()*.02+.005}));
function draw(){
 x.clearRect(0,0,c.width,c.height);
 for(const s of stars){s.a+=s.s;if(s.a>1||s.a<0)s.s*=-1;x.globalAlpha=s.a*.6;x.fillStyle="#fff";x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()}
 requestAnimationFrame(draw)
}draw();

document.getElementById('forgive').onclick=()=>{
 document.getElementById('forgive').style.display='none';
 const e=document.getElementById('extra');e.classList.remove('hidden');e.classList.add('reveal');
 for(let i=0;i<24;i++){
  const h=document.createElement('div');h.className='heart';h.textContent=['❤','♡','🌸','✨'][Math.floor(Math.random()*4)];
  h.style.left=(35+Math.random()*30)+'vw';h.style.top=(55+Math.random()*15)+'vh';
  h.style.animationDelay=(Math.random()*.7)+'s';document.body.appendChild(h);
  setTimeout(()=>h.remove(),3500)
 }
};
</script>
</body>
</html>
